<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>링크나무 관리</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">

  <!-- 로그인 -->
  <section id="login" class="panel">
    <h2>🌳 링크나무 관리자</h2>
    <label for="pw">관리자 비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="row end" style="margin-top:12px"><button class="primary" id="loginBtn">로그인</button></div>
    <div class="msg err" id="loginMsg"></div>
  </section>

  <!-- 관리 화면 -->
  <section id="app" class="hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <b>🌳 링크나무 관리</b>
      <span class="row">
        <button class="small" id="copyBtn">내 링크 복사</button>
        <a href="/" target="_blank"><button class="small">내 페이지 보기</button></a>
        <button class="small" id="logoutBtn">로그아웃</button>
      </span>
    </div>

    <div class="stat">
      <div><b id="sLinks">0</b><span>링크 수</span></div>
      <div><b id="sClicks">0</b><span>전체 클릭</span></div>
    </div>

    <div class="panel">
      <h2>프로필</h2>
      <div class="avatar-edit">
        <div id="avatarPreview" class="avatar"></div>
        <div>
          <input type="file" id="avatarFile" accept="image/*">
          <button class="small danger" id="avatarClear" style="margin-top:6px">사진 삭제</button>
        </div>
      </div>
      <label for="name">이름</label>
      <input type="text" id="name" maxlength="40">
      <label for="bio">한 줄 소개</label>
      <input type="text" id="bio" maxlength="100">
      <div class="row end" style="margin-top:12px"><button class="primary" id="saveProfile">프로필 저장</button></div>
      <div class="msg" id="profileMsg"></div>
    </div>

    <div class="panel">
      <h2>링크 추가</h2>
      <label for="newTitle">제목</label>
      <input type="text" id="newTitle" maxlength="60" placeholder="예: 내 블로그">
      <label for="newUrl">URL</label>
      <input type="text" id="newUrl" placeholder="https://blog.example.com">
      <div class="row end" style="margin-top:12px"><button class="primary" id="addBtn">추가</button></div>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="panel">
      <h2>내 링크 · 클릭 수</h2>
      <div id="list"></div>
    </div>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let pw = sessionStorage.getItem('adminPw') || '';
  let state = { profile: {}, links: [] };
  let avatarData = '';

  async function api(method, path, body) {
    const res = await fetch('/api/admin' + path, {
      method,
      headers: { 'Content-Type': 'application/json', 'x-admin-password': pw },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || '오류가 발생했습니다.'); e.status = res.status; throw e; }
    return data;
  }
  function flash(el, text, isErr) {
    el.textContent = text; el.className = 'msg' + (isErr ? ' err' : '');
    if (!isErr) setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 2500);
  }

  async function load() {
    state = await api('GET', '/page');
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('name').value = state.profile.name || '';
    $('bio').value = state.profile.bio || '';
    avatarData = state.profile.avatar || '';
    renderAvatar();
    renderList();
  }

  function renderAvatar() {
    const box = $('avatarPreview');
    box.textContent = '';
    box.style.backgroundImage = '';
    if (avatarData) {
      box.style.background = `center/cover url("${avatarData.replace(/"/g, '%22')}")`;
    } else {
      box.style.background = '';
      box.textContent = ($('name').value || '?').charAt(0);
    }
  }

  function renderList() {
    const total = state.links.reduce((s, l) => s + (l.clicks || 0), 0);
    const max = Math.max(1, ...state.links.map((l) => l.clicks || 0));
    $('sLinks').textContent = state.links.length;
    $('sClicks').textContent = total;
    const list = $('list');
    list.textContent = '';
    if (!state.links.length) {
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = '링크를 추가해 보세요.';
      list.append(p); return;
    }
    state.links.forEach((l, i) => {
      const item = document.createElement('div'); item.className = 'item';

      const top = document.createElement('div'); top.className = 'top';
      const left = document.createElement('div');
      const name = document.createElement('div'); name.className = 'name'; name.textContent = l.title;
      const url = document.createElement('div'); url.className = 'url'; url.textContent = l.url;
      left.append(name, url);
      const c = document.createElement('div'); c.className = 'clicks'; c.textContent = (l.clicks || 0) + '회';
      top.append(left, c);

      const bar = document.createElement('div'); bar.className = 'bar';
      const fill = document.createElement('i'); fill.style.width = ((l.clicks || 0) / max * 100) + '%';
      bar.append(fill);

      const btns = document.createElement('div'); btns.className = 'row';
      const mk = (label, cls, fn, disabled) => {
        const b = document.createElement('button'); b.className = 'small ' + (cls || '');
        b.textContent = label; b.disabled = !!disabled; b.onclick = fn; btns.append(b);
      };
      mk('▲', '', () => act('POST', `/links/${l.id}/up`), i === 0);
      mk('▼', '', () => act('POST', `/links/${l.id}/down`), i === state.links.length - 1);
      mk('수정', '', () => edit(l));
      mk('클릭 초기화', '', () => confirm('이 링크의 클릭 수를 0으로 초기화할까요?') && act('POST', `/links/${l.id}/reset`));
      mk('삭제', 'danger', () => confirm(`"${l.title}" 링크를 삭제할까요?`) && act('DELETE', `/links/${l.id}`));

      item.append(top, bar, btns);
      list.append(item);
    });
  }

  async function act(method, path, body) {
    try { await api(method, path, body); await load(); }
    catch (e) { alert(e.message); }
  }
  function edit(l) {
    const title = prompt('제목', l.title); if (title === null) return;
    const url = prompt('URL', l.url); if (url === null) return;
    act('PUT', `/links/${l.id}`, { title, url });
  }

  // 로그인
  async function login() {
    pw = $('pw').value || pw;
    try { await load(); sessionStorage.setItem('adminPw', pw); }
    catch (e) { $('loginMsg').textContent = e.status === 401 ? '비밀번호가 올바르지 않습니다.' : e.message; sessionStorage.removeItem('adminPw'); }
  }
  $('loginBtn').onclick = login;
  $('pw').addEventListener('keydown', (e) => e.key === 'Enter' && login());
  $('logoutBtn').onclick = () => { sessionStorage.removeItem('adminPw'); location.reload(); };
  $('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(location.origin + '/'); $('copyBtn').textContent = '복사됨!'; }
    catch { prompt('이 주소를 복사하세요', location.origin + '/'); }
    setTimeout(() => ($('copyBtn').textContent = '내 링크 복사'), 1500);
  };

  // 프로필
  $('name').addEventListener('input', () => !avatarData && renderAvatar());
  $('avatarClear').onclick = () => { avatarData = ''; $('avatarFile').value = ''; renderAvatar(); };
  $('avatarFile').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    const objUrl = URL.createObjectURL(f);
    img.onload = () => {
      const S = 256, canvas = document.createElement('canvas'); canvas.width = canvas.height = S;
      const side = Math.min(img.width, img.height);   // 가운데 정사각형으로 잘라 256px로 축소
      canvas.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
      avatarData = canvas.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(objUrl);
      renderAvatar();
    };
    img.onerror = () => flash($('profileMsg'), '이미지를 읽을 수 없습니다.', true);
    img.src = objUrl;
  };
  $('saveProfile').onclick = async () => {
    try {
      await api('PUT', '/profile', { name: $('name').value, bio: $('bio').value, avatar: avatarData });
      flash($('profileMsg'), '저장되었습니다.');
    } catch (e) { flash($('profileMsg'), e.message, true); }
  };

  // 링크 추가
  $('addBtn').onclick = async () => {
    try {
      await api('POST', '/links', { title: $('newTitle').value, url: $('newUrl').value });
      $('newTitle').value = ''; $('newUrl').value = '';
      flash($('addMsg'), '추가되었습니다.');
      await load();
    } catch (e) { flash($('addMsg'), e.message, true); }
  };

  if (pw) load().catch(() => sessionStorage.removeItem('adminPw'));
})();
</script>
</body>
</html>
